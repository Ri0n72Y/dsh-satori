name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - run: mkdir -p /tmp/dsh-satori-pack && pnpm pack --pack-destination /tmp/dsh-satori-pack

  dsh-compat:
    runs-on: ubuntu-latest
    env:
      DSH_RELEASE_SHA: 47f943859bef60e4160492346772ded9b24f765a
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - run: corepack enable
      - name: Install plugin dependencies
        run: pnpm install --frozen-lockfile
      - name: Checkout pinned DeepSeek Harness source
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: 47f943859bef60e4160492346772ded9b24f765a
          path: .dsh-source
          persist-credentials: false
      - name: Verify DSH source baseline
        run: test "$(git -C .dsh-source rev-parse HEAD)" = "${DSH_RELEASE_SHA}"
      - name: Install DSH workspace dependencies
        run: pnpm --dir .dsh-source install --frozen-lockfile --ignore-scripts
      - name: Build DSH host declarations with upstream configuration
        run: pnpm --dir .dsh-source build:lib:host
      - name: Typecheck plugin against built DSH public declarations
        run: pnpm exec tsc -p tsconfig.compat.json --noEmit
      - name: Build after DSH compatibility typecheck
        run: pnpm build
      - name: Record compatibility baseline
        run: echo "DSH source ${DSH_RELEASE_SHA}; Node $(node --version)"
